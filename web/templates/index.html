<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一副牌升级 · Web GUI</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #0d6b3e;
  color: #ecf0f1;
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  display: flex;
  flex-direction: column;
}
.top-frame {
  height: 50px;
  background: #2c3e50;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  flex: 0 0 auto;
}
.title { font-size: 16px; font-weight: 700; margin-right: 6px; white-space: nowrap; }
button {
  border: 0;
  height: 34px;
  padding: 0 14px;
  border-radius: 0;
  color: white;
  cursor: pointer;
  font-family: inherit;
  font-size: 12px;
}
button:disabled { opacity: .45; cursor: not-allowed; }
.btn-start { background: #27ae60; }
.btn-step { background: #2980b9; }
.btn-auto { background: #34495e; color: #ecf0f1; }
.btn-auto.running { background: #e67e22; color: white; }
.btn-export { background: #34495e; color: #ecf0f1; }
.btn-reset { background: #c0392b; }
.label { font-size: 11px; color: #ecf0f1; white-space: nowrap; }
.hint { font-size: 10px; color: #bdc3c7; margin-left: -5px; }
select, input {
  height: 24px;
  background: #3d566e;
  color: white;
  border: 0;
  outline: 0;
  font-size: 12px;
  text-align: center;
}
select { width: 64px; }
input { width: 50px; }
.status-top { flex: 1; text-align: center; font-size: 13px; color: #ecf0f1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.canvas-wrap { flex: 1 1 auto; min-height: 0; padding: 2px; background: #0d6b3e; }
#gameCanvas { display: block; width: 100%; height: 100%; background: #0f7a44; cursor: pointer; }
.status-bar {
  height: 22px;
  background: #2c3e50;
  color: #ecf0f1;
  font-size: 10px;
  padding: 3px 10px;
  flex: 0 0 auto;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, .55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 50;
}
.hidden { display: none; }
.modal {
  width: 460px;
  min-height: 500px;
  background: #1a2a3a;
  color: #ecf0f1;
  padding: 14px 24px 12px;
  box-shadow: 0 12px 36px rgba(0,0,0,.35);
}
.modal h2 { text-align: center; color: #f1c40f; font-size: 18px; margin-bottom: 4px; }
.modal .result { text-align: center; color: #f1c40f; font-size: 14px; margin-bottom: 10px; }
.modal table { width: 100%; border-collapse: collapse; font-size: 12px; }
.modal th, .modal td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #34495e; }
.modal th { color: #bdc3c7; }
.modal .actions { text-align: center; margin-top: 16px; }
.modal .actions button { width: 160px; height: 52px; background: #2980b9; font-size: 14px; font-weight: 700; }
.btn-replay { background: #8e44ad; }
.btn-mini { height: 24px; padding: 0 10px; font-size: 11px; background: #2980b9; }
#gamesTable th, #gamesTable td { text-align: center; }
#gamesTable thead th { position: sticky; top: 0; background: #1a2a3a; }
#gamesTable tbody tr { cursor: pointer; }
#gamesTable tbody tr:hover { background: #24384d; }
/* 文字记录面板: 记录按钮上方上拉半透明窗口 */
#logPanel {
  position: fixed; right: 12px; bottom: 80px; z-index: 45;
  width: 500px; max-width: calc(100vw - 24px);
  max-height: min(66vh, 620px);
  display: flex; flex-direction: column;
  background: rgba(13, 24, 38, .95);
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.5);
  overflow: hidden; font-size: 12px;
}
#logPanel.hidden { display: none; }
.lp-head {
  display: flex; align-items: center; gap: 6px;
  padding: 7px 10px 7px 14px; background: rgba(255,255,255,.06);
  border-bottom: 1px solid rgba(255,255,255,.1);
}
.lp-title { flex: 1; color: #f1c40f; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lp-x { height: 24px; width: 24px; padding: 0; border-radius: 6px; background: #c0392b; font-size: 12px; line-height: 1; }
#logBody { overflow: auto; padding: 8px 12px 10px; }
#logBody .r-hdr { font-weight: 700; font-size: 13px; color: #f1c40f; margin: 2px 0 2px; }
#logBody .r-side { color: #bdc3c7; margin-bottom: 4px; }
#logBody .lsect {
  color: #7f8c8d; font-size: 11px; margin: 8px 0 3px;
  display: flex; align-items: center; gap: 6px;
}
#logBody .lsect::before { content: '▍'; color: #2980b9; font-size: 12px; }
#logBody .ln { color: #dbe2ea; line-height: 1.7; }
#logBody .ln b { color: #ecf0f1; }
#logBody .ln.dim { color: #7f8c8d; }
#logBody .pcards { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; margin-top: 1px; }
#logBody .lchip {
  display: inline-flex; align-items: center; justify-content: center;
  height: 19px; min-width: 26px; padding: 0 3px; box-sizing: border-box;
  background: rgba(255,255,255,.92); border-radius: 4px;
  font-weight: 700; font-size: 11px; box-shadow: 0 1px 2px rgba(0,0,0,.3);
  white-space: nowrap;
}
#logBody .trick {
  margin: 6px 0; padding: 5px 8px 6px;
  background: rgba(255,255,255,.035); border-left: 3px solid #2980b9;
  border-radius: 4px;
}
#logBody .tk-head { color: #ecf0f1; font-weight: 700; margin-bottom: 4px; }
#logBody .play { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
#logBody .plab { flex: 0 0 84px; text-align: right; line-height: 1.3; white-space: nowrap; }
#logBody .plab b { color: #ecf0f1; }
#logBody .plab .s { font-size: 9px; padding: 0 3px; border-radius: 3px; margin-left: 3px; }
#logBody .plab .s.dz { background: rgba(241,196,15,.2); color: #f1c40f; }
#logBody .plab .s.ak { background: rgba(93,173,226,.2); color: #5dade2; }
#logBody .play.win { background: rgba(241,196,15,.09); border-radius: 4px; }
#logBody .play.win .plab b { color: #f1c40f; }
#logBody .settle { margin-top: 8px; padding: 6px 8px; border-radius: 4px; background: rgba(241,196,15,.08); border: 1px solid rgba(241,196,15,.3); }
#logBody .settle .r-result { color: #f1c40f; font-weight: 700; font-size: 13px; margin-top: 2px; }
</style>
</head>
<body>
<div class="top-frame">
  <div class="title">🎮 一副牌升级</div>
  <button class="btn-start" id="btnStart">▶ 开始</button>
  <button class="btn-step" id="btnStep" disabled>▶ 下一步</button>
  <button class="btn-step" id="btnPrev" style="display:none">⏪ 上一步</button>
  <button class="btn-auto" id="btnAuto" disabled>▶▶ 自动</button>
  <button class="btn-replay" id="btnGames" disabled>📋 对局记录</button>
  <button class="btn-export" id="btnExport" disabled>📊 导出</button>
  <button class="btn-reset" id="btnReset">🔄 重置</button>
  <span class="label">延迟:</span>
  <select id="speedSel">
    <option value="800">慢速</option>
    <option value="400" selected>中速</option>
    <option value="150">快速</option>
    <option value="30">极速</option>
  </select>
  <span class="label">牌型:</span>
  <input id="hongInput"><span class="hint">轰</span>
  <span class="label">种子:</span><input id="seedInput">
  <span class="label">轮数:</span><input id="roundsInput">
  <div class="status-top" id="statusTop">就绪 | 点击「开始」启动游戏</div>
</div>
<div class="canvas-wrap"><canvas id="gameCanvas"></canvas></div>
<div class="status-bar" id="statusBar">就绪 | 点击「开始」启动游戏</div>

<div class="modal-overlay hidden" id="settleModal">
  <div class="modal">
    <h2 id="modalTitle">第 1 局结算</h2>
    <div class="result" id="modalResult"></div>
    <table id="modalTable"></table>
    <div class="actions"><button id="modalContinue">继续</button></div>
  </div>
</div>

<div class="modal-overlay hidden" id="gamesModal">
  <div class="modal" style="width:560px; min-height:0;">
    <h2>对局记录</h2>
    <div style="max-height:55vh; overflow:auto;">
      <table id="gamesTable">
        <thead>
          <tr><th>局数</th><th>本局级牌</th><th>主花色</th><th>庄家</th><th>得分</th><th>升级(庄/闲)</th><th>操作</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="actions"><button id="gamesClose">关闭</button></div>
  </div>
</div>

<div id="logPanel" class="hidden">
  <div class="lp-head">
    <span class="lp-title" id="logTitle">文字记录</span>
    <button id="logClose" class="lp-x" title="关闭">✕</button>
  </div>
  <div id="logBody"></div>
</div>

<button id="btnLive" style="position:fixed; right:90px; bottom:38px; z-index:40; display:none; background:#16a085">⏭ 退出回放</button>
<button id="btnLog" style="position:fixed; right:12px; bottom:38px; z-index:40; display:none; background:#8e44ad">📝 记录</button>

<script>
const CARD_W = 62, CARD_H = 88;
const MINI_W = 31, MINI_H = 44;
const SUIT_CN = {'♠':'黑桃','♥':'红桃','♣':'草花','♦':'方块'};
const SCORE_VALUES = {'5':5, '10':10, 'K':10};
const PATTERN_NAMES = {'single':'单张','510k':'5·10·K','hong':'💥轰','zha':'💣炸'};

let sessionId = null;
let gameData = null;
let autoRunning = false;
let autoTimer = null;
let speed = 400;
let modalShownFor = null;
let logOpen = false;     // 文字记录面板是否展开
let logRnd = null;       // 面板当前展示的局
let logLive = -1;        // 面板拉取时的 live_steps
let logSeq = 0;          // 日志请求 token，防异步串帧

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.floor(rect.width * dpr));
  canvas.height = Math.max(1, Math.floor(rect.height * dpr));
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  renderCanvas();
}
window.addEventListener('resize', resizeCanvas);

function colorFor(card) {
  if (!card) return '#1a1a2e';
  if (card.rank === '大王') return '#c0392b';
  if (card.rank === '小王') return '#1a1a2e';
  return (card.suit === '♥' || card.suit === '♦') ? '#c0392b' : '#1a1a2e';
}

function trumpStars(card) {
  const rr = gameData?.round_record;
  if (!card || !rr || !rr.level || !rr.trump_suit) return 0;
  if (card.rank === '大王' || card.rank === '小王') return 2;
  if (card.rank === '3' && card.suit === '♥') return 2;
  if (card.rank === '2') return 2;
  if (card.rank === rr.level) return 2;
  if (card.suit === rr.trump_suit) return 1;
  return 0;
}

function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

function drawCard(c, x, y, card, opts = {}) {
  const small = !!opts.small;
  const w = small ? 52 : CARD_W;
  const h = small ? 74 : CARD_H;
  const r = small ? 7 : 8;
  roundRectPath(c, x, y, w, h, r);
  c.fillStyle = 'white';
  c.fill();
  c.strokeStyle = opts.highlight ? '#e74c3c' : '#bdc3c7';
  c.lineWidth = opts.highlight ? 2 : 1;
  c.stroke();
  const cx = x + w / 2, cy = y + h / 2;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  if (card.rank === '大王' || card.rank === '小王') {
    c.fillStyle = colorFor(card);
    c.font = `bold ${small ? 16 : 22}px "Microsoft YaHei"`;
    c.fillText(card.rank, cx, cy - 2);
  } else {
    c.fillStyle = colorFor(card);
    c.font = `${small ? 26 : 32}px "Segoe UI Symbol", "Microsoft YaHei"`;
    c.fillText(`${card.rank}${card.suit}`, cx, cy);
  }
  const sc = trumpStars(card);
  if (sc) {
    c.fillStyle = '#f1c40f';
    c.font = `${small ? 8 : 10}px "Microsoft YaHei"`;
    c.textAlign = 'left';
    c.textBaseline = 'bottom';
    c.fillText('★'.repeat(sc), x + 6, y + h - 5);
  }
}

function drawCompactCard(c, x, y, card, opts = {}) {
  roundRectPath(c, x, y, MINI_W, MINI_H, 4);
  c.fillStyle = 'white';
  c.fill();
  c.strokeStyle = opts.highlight ? '#e74c3c' : '#bdc3c7';
  c.lineWidth = opts.highlight ? 2 : 1;
  c.stroke();
  c.fillStyle = colorFor(card);
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  if (card.rank === '大王' || card.rank === '小王') {
    c.font = 'bold 10px "Microsoft YaHei"';
    c.fillText(card.rank === '大王' ? '大' : '小', x + MINI_W / 2, y + MINI_H / 2 - 1);
  } else {
    c.font = '16px "Segoe UI Symbol", "Microsoft YaHei"';
    c.fillText(`${card.rank}${card.suit}`, x + MINI_W / 2, y + MINI_H / 2);
  }
  const sc = trumpStars(card);
  if (sc) {
    c.fillStyle = '#f1c40f';
    c.font = '7px "Microsoft YaHei"';
    c.textAlign = 'left';
    c.textBaseline = 'bottom';
    c.fillText('★'.repeat(sc), x + 4, y + MINI_H - 3);
  }
}

function drawText(c, text, x, y, font, color, align = 'center', baseline = 'middle') {
  c.font = font;
  c.fillStyle = color;
  c.textAlign = align;
  c.textBaseline = baseline;
  c.fillText(text, x, y);
}

function renderCanvas() {
  const rect = canvas.getBoundingClientRect();
  const w = rect.width || 1280;
  const h = rect.height || 830;
  const cx = w / 2, cy = h / 2;
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#0f7a44';
  ctx.fillRect(0, 0, w, h);

  if (!gameData) return;
  const rr = gameData.round_record;
  if (rr?.trump_suit) {
    drawText(ctx, `主: ${SUIT_CN[rr.trump_suit] || rr.trump_suit}`, w - 180, 14, '9px "Microsoft YaHei"', '#bdc3c7', 'left');
  }
  drawText(ctx, `本局打 ${gameData.defender_level}`, w - 180, 34, 'bold 12px "Microsoft YaHei"', '#f1c40f', 'left');

  if (['trump','bury','pick'].includes(gameData.state)) {
    drawPrePlayingHands(w, h, cx, cy);
    drawBottomCards(w, h, cx, cy);
    drawStageLabel(w, h, cx, cy);
    drawTrumpIndicators(w, h, cx, cy);
  } else if (['playing','settled'].includes(gameData.state)) {
    drawPlayerHands(w, h, cx, cy);
    drawBuriedBottomCompact(w, h, cx);
    drawCenter(w, h, cx, cy);
  }
  if (gameData.current_trick && gameData.reveal_count == null && gameData.state !== 'settled') {
    drawTrickResult(w, h, cx, cy);
  }
  if (gameData.game_over) drawGameOver(w, h);
  if (gameData?.replay) drawReplayBanner(w);
}

// 回放态画面标识: 左上角红色横幅（悬于牌桌上层）
function drawReplayBanner(w) {
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  roundRectPath(ctx, 8, 6, 116, 26, 6);
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,107,107,.5)';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.font = 'bold 13px "Microsoft YaHei"';
  ctx.fillStyle = '#ff6b6b';
  ctx.textAlign = 'left';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔴 回放中', 18, 19);
}

function hand(pid) { return gameData?.hands?.[String(pid)] || []; }

function drawPrePlayingHands(w, h, cx, cy) {
  for (let pid = 0; pid < 4; pid++) {
    const cards = hand(pid);
    if (!cards.length) continue;
    let label = `玩家${pid + 1}`;
    if (pid === gameData.dealer_pid) label += ' (庄)';
    else if (!(gameData.dt || []).includes(pid)) label += ' (抓)';
    if (pid === 0) {
      const startX = cx - (cards.length * (MINI_W + 5)) / 2;
      const y = h - MINI_H - 15;
      cards.forEach((card, i) => drawCompactCard(ctx, startX + i * (MINI_W + 5), y, card));
      drawText(ctx, label, cx, y - 12, 'bold 10px "Microsoft YaHei"', '#ecf0f1');
    } else if (pid === 1) {
      const x = w - MINI_W - 6, y0 = 60;
      cards.forEach((card, i) => drawCompactCard(ctx, x, y0 + i * (MINI_H + 5), card));
      drawText(ctx, label, w - 4, 50, 'bold 10px "Microsoft YaHei"', '#ecf0f1', 'right');
    } else if (pid === 2) {
      const startX = cx - (cards.length * (MINI_W + 5)) / 2;
      const y = (gameData?.replay) ? 60 : 12;      // 回放态让出顶部横幅空间
      cards.forEach((card, i) => drawCompactCard(ctx, startX + i * (MINI_W + 5), y, card));
      drawText(ctx, label, cx, y + MINI_H + 12, 'bold 10px "Microsoft YaHei"', '#ecf0f1');
    } else {
      const x = 6, y0 = 60;
      cards.forEach((card, i) => drawCompactCard(ctx, x, y0 + i * (MINI_H + 5), card));
      drawText(ctx, label, 4, 50, 'bold 10px "Microsoft YaHei"', '#ecf0f1', 'left');
    }
  }
}

function drawBottomCards(w, h, cx, cy) {
  const bottom = gameData.bottom || [];
  const rr = gameData.round_record;
  if (!bottom.length || !rr) return;
  const cw = 52, ch = 74, gap = 8;
  const startX = cx - (bottom.length * (cw + gap)) / 2;
  const y = cy - ch - 20;
  let title = '🂠 底牌';
  if (rr.trump_method === 'bottom_card') title += ' (翻底牌定主)';
  drawText(ctx, `${title} (${bottom.length}张)`, cx, y - 20, 'bold 11px "Microsoft YaHei"', '#f1c40f');
  bottom.forEach((card, i) => drawCard(ctx, startX + i * (cw + gap), y, card, {small:true}));
}

function drawStageLabel(w, h, cx, cy) {
  const labels = {trump:'⭐ 定主阶段 — 亮牌 / 闷牌', bury:'📦 埋底阶段 — 庄家选牌埋入底牌', pick:'🔍 捡主阶段 — 翻开闷牌，拣出主牌'};
  const text = labels[gameData.state];
  if (text) drawText(ctx, text, cx, cy - 165, 'bold 12px "Microsoft YaHei"', '#f39c12');
}

function drawTrumpIndicators(w, h, cx, cy) {
  const rr = gameData.round_record;
  if (!rr) return;
  const pos = {0:[cx, h - 160], 1:[w - 80, cy], 2:[cx, 145], 3:[80, cy]};
  if (rr.trump_method === 'bright' && rr.bright_pid != null) {
    const [px, py] = pos[rr.bright_pid];
    drawText(ctx, '⭐ 亮牌', px, py - 40, 'bold 11px "Microsoft YaHei"', '#f1c40f');
    drawCard(ctx, px - CARD_W / 2, py - 10, rr.bright_card, {highlight:true});
  } else if (rr.trump_method === 'concealed' && rr.concealed_pid != null) {
    const [px, py] = pos[rr.concealed_pid];
    drawText(ctx, '🃏 闷牌', px, py - 40, 'bold 11px "Microsoft YaHei"', '#3498db');
    drawCard(ctx, px - CARD_W / 2, py - 10, rr.concealed_card, {highlight:true});
  }
}

function drawPlayerHands(w, h, cx, cy) {
  for (let pid = 0; pid < 4; pid++) {
    const cards = hand(pid);
    const side = (gameData.dt || []).includes(pid) ? '(庄)' : '(抓)';
    const label = `玩家${pid + 1}${side} (${cards.length}张)`;
    if (pid === 0) {
      const y = h - MINI_H - 15;
      const startX = cx - (cards.length * (MINI_W + 5)) / 2;
      cards.forEach((card, i) => drawCompactCard(ctx, startX + i * (MINI_W + 5), y, card));
      drawText(ctx, label, cx, y - 12, 'bold 10px "Microsoft YaHei"', '#ecf0f1');
    } else if (pid === 1) {
      const x = w - MINI_W - 6, y0 = 60;
      if (cards.length) cards.forEach((card, i) => drawCompactCard(ctx, x, y0 + i * (MINI_H + 5), card));
      else drawText(ctx, '—', x + MINI_W/2, y0 + MINI_H/2, '12px "Microsoft YaHei"', '#7f8c8d');
      drawText(ctx, label, w - 4, 50, 'bold 10px "Microsoft YaHei"', '#ecf0f1', 'right');
    } else if (pid === 2) {
      const y = (gameData?.replay) ? 60 : 12;      // 回放态让出顶部横幅空间
      const startX = cx - (cards.length * (MINI_W + 5)) / 2;
      cards.forEach((card, i) => drawCompactCard(ctx, startX + i * (MINI_W + 5), y, card));
      drawText(ctx, label, cx, y + MINI_H + 12, 'bold 10px "Microsoft YaHei"', '#ecf0f1');
    } else {
      const x = 6, y0 = 60;
      if (cards.length) cards.forEach((card, i) => drawCompactCard(ctx, x, y0 + i * (MINI_H + 5), card));
      else drawText(ctx, '—', x + MINI_W/2, y0 + MINI_H/2, '12px "Microsoft YaHei"', '#7f8c8d');
      drawText(ctx, label, 4, 50, 'bold 10px "Microsoft YaHei"', '#ecf0f1', 'left');
    }
  }
}

function drawBuriedBottomCompact(w, h, cx) {
  const rr = gameData.round_record;
  if (!rr?.bottom_after_bury?.length) return;
  const bottom = rr.bottom_after_pick?.length ? rr.bottom_after_pick : rr.bottom_after_bury;
  const y = h - 215;
  const parts = [`📦 玩家${gameData.dealer_pid + 1}埋底`];
  if (rr.concealed_pid != null && rr.picked_from_bottom?.length) {
    const picked = rr.picked_from_bottom.map(c => (c.rank === '大王' || c.rank === '小王') ? c.rank : `${c.rank}${c.suit}`).join(', ');
    parts.push(`🔍 玩家${rr.concealed_pid + 1}捡主 (${picked})`);
  }
  drawText(ctx, `${parts.join(' | ')} (${bottom.length}张)`, cx, y - 12, 'bold 10px "Microsoft YaHei"', '#f1c40f');
  const startX = cx - (bottom.length * (MINI_W + 5)) / 2;
  bottom.forEach((card, i) => drawCompactCard(ctx, startX + i * (MINI_W + 5), y, card));
  const score = bottom.reduce((sum, c) => sum + (SCORE_VALUES[c.rank] || 0), 0);
  drawText(ctx, `底牌: ${score}分`, cx, y + MINI_H + 12, '8px "Microsoft YaHei"', '#bdc3c7');
}

function drawCenter(w, h, cx, cy) {
  const t = gameData.current_trick;
  if (t) {
    // Match gui.py's seat-relative layout, but derive offsets from the
    // browser canvas size instead of hard-coding 1280x830 Tk coordinates.
    const xOffset = Math.min(360, Math.max(230, w * 0.28));
    const topY = Math.max(135, Math.min(200, h * 0.24));
    const bottomY = Math.min(h - 285, Math.max(cy + 85, h * 0.58));
    const positions = {
      0: [cx - CARD_W / 2, bottomY],
      1: [cx + xOffset - CARD_W / 2, cy - CARD_H / 2],
      2: [cx - CARD_W / 2, topY],
      3: [cx - xOffset - CARD_W / 2, cy - CARD_H / 2],
    };
    const allRevealed = gameData.reveal_count == null;
    for (const play of t.played) {
      const cl = play.cards || [];
      if (!cl.length) continue;
      const [px, py] = positions[play.pid];
      const totalW = cl.length * (CARD_W + 4) - 4;
      const startX = px + (CARD_W - totalW) / 2;
      cl.forEach((card, j) => drawCard(ctx, startX + j * (CARD_W + 4), py, card, {highlight: allRevealed && play.pid === t.winner}));
      if (allRevealed && cl.length > 1) {
        const pname = trickPatternName(cl);
        if (pname) drawText(ctx, pname, startX + totalW / 2, py + CARD_H + 12, 'bold 9px "Microsoft YaHei"', '#f39c12');
      }
    }
  }
  if (gameData.state === 'settled' && gameData.round_record) drawSettlement(w, h, cx, cy);
}

function trickPatternName(cl) {
  if (cl.length === 3 && new Set(cl.map(c => c.rank)).size === 3 && cl.every(c => ['5','10','K'].includes(c.rank))) return '510K';
  if (cl.length === 4) {
    const ranks = cl.map(c => c.rank);
    if (new Set(ranks).size === 1) return '💥 轰';
    if (new Set(ranks).size === 2 && ranks.includes('A')) return '💣 炸';
  }
  return '';
}

function drawSettlement(w, h, cx, cy) {
  const rr = gameData.round_record;
  const lines = [];
  if (rr.last_trick_winner_side === 'attacker') lines.push(`玩家${rr.last_trick_winner_pid + 1} 扣底 | 得分：${rr.attacker_score}`);
  else lines.push(`得分：${rr.attacker_score}`);
  const parts = [];
  if (rr.final_up_def > 0) parts.push(`庄家 +${rr.final_up_def}级`);
  if (rr.final_up_att > 0) parts.push(`闲家 +${rr.final_up_att}级`);
  if (parts.length) lines.push(parts.join(' | '));
  lines.push(`下局打 ${gameData.next_defender_level}`);
  lines.forEach((line, i) => drawText(ctx, line, cx, cy - 50 + i * 30, `bold ${i === 0 ? 13 : 11}px "Microsoft YaHei"`, i === 0 ? '#f1c40f' : '#f39c12'));
}

function drawTrickResult(w, h, cx, cy) {
  const t = gameData.current_trick;
  if (!t) return;
  const pname = PATTERN_NAMES[t.pattern] || '单张';
  drawText(ctx, `第${t.num}圈 [${pname}] 赢: 玩家${t.winner + 1} (+${t.score}分)`, cx, cy, 'bold 11px "Microsoft YaHei"', '#f39c12');
}

function drawGameOver(w, h) {
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, 0, w, h);
  drawText(ctx, `🏆 ${gameData.winner || '游戏结束'}`, w / 2, h / 2 - 20, 'bold 32px "Microsoft YaHei"', '#f1c40f');
  drawText(ctx, `共 ${gameData.round} 局 | 队伍A:${gameData.team_a_level} 队伍B:${gameData.team_b_level}`, w / 2, h / 2 + 30, '14px "Microsoft YaHei"', '#ecf0f1');
}

function syncStatus() {
  const text = gameData?.status || '就绪 | 点击「开始」启动游戏';
  document.getElementById('statusTop').textContent = text;
  document.getElementById('statusBar').textContent = text;
}

function render() {
  syncStatus();
  updateReplayUI();
  renderCanvas();
  refreshLogIfOpen();
  if (gameData?.state === 'settled' && modalShownFor !== gameData.round && !autoRunning && !gameData.replay) showSettlementModal();
}

function showSettlementModal() {
  const rr = gameData.round_record;
  if (!rr) return;
  modalShownFor = gameData.round;
  document.getElementById('modalTitle').textContent = `第 ${rr.rnd} 局结算`;
  document.getElementById('modalResult').textContent = rr.result_title || '';
  const methodMap = {bright:'亮牌', concealed:'闷牌', bottom_card:'底牌'};
  const rows = [
    ['主花色', `${rr.trump_suit_cn || '?'} (${methodMap[rr.trump_method] || '?'})`],
    ['庄家方级牌', gameData.defender_level],
    ['抓分方级牌', gameData.attacker_level],
    ['庄家阵营', `玩家${gameData.dt[0] + 1}、玩家${gameData.dt[1] + 1}`],
    ['抓分阵营', `玩家${gameData.at[0] + 1}、玩家${gameData.at[1] + 1}`],
    ['抓分方得分', `${rr.attacker_score} 分`],
    ['庄家方升级', `+${rr.final_up_def}`],
    ['抓分方升级', `+${rr.final_up_att}`],
    ['扣底奖励', rr.bonus_up > 0 ? `+${rr.bonus_up}` : '无'],
    ['圈数', `${rr.tricks.length}/12`],
  ];
  document.getElementById('modalTable').innerHTML = '<tr><th>项目</th><th>值</th></tr>' + rows.map(([k,v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
  document.getElementById('settleModal').classList.remove('hidden');
}

function closeModal() { document.getElementById('settleModal').classList.add('hidden'); }

function setButtons(running) {
  document.getElementById('btnStart').disabled = running;
  document.getElementById('btnStep').disabled = !running || autoRunning;
  document.getElementById('btnAuto').disabled = !running;
  document.getElementById('btnExport').disabled = !running && !sessionId;
}

async function apiCall(url, data) {
  const res = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data || {})});
  return res.json();
}

function parseHong(value) {
  const v = value.trim();
  if (!v) return null;
  const parts = v.replace('-', ':').split(':').map(x => parseInt(x, 10));
  if (!Number.isFinite(parts[0])) return null;
  return [parts[0], Number.isFinite(parts[1]) ? parts[1] : parts[0]];
}

async function newGame() {
  const body = {};
  const seed = document.getElementById('seedInput').value.trim();
  const rounds = document.getElementById('roundsInput').value.trim();
  const hong = parseHong(document.getElementById('hongInput').value);
  if (seed) body.seed = parseInt(seed, 10);
  if (rounds) body.total_rounds = parseInt(rounds, 10);
  if (hong) body.deal_requirements = {hong};
  const resp = await apiCall('api/new', body);
  sessionId = resp.session_id;
  gameData = resp;
  modalShownFor = null;
  closeModal();
  closeGames();
  setButtons(true);
  render();
}

async function doStep() {
  if (!sessionId) return;
  closeModal();
  gameData = await apiCall('api/step', {session_id: sessionId});
  if (gameData.game_over) stopAuto();
  setButtons(!gameData.game_over);
  if (gameData.game_over) document.getElementById('btnExport').disabled = false;
  render();
}

function startAuto() {
  autoRunning = true;
  closeModal();
  const btn = document.getElementById('btnAuto');
  btn.textContent = '⏸ 暂停';
  btn.classList.add('running');
  setButtons(true);
  tick();
}

function stopAuto() {
  autoRunning = false;
  if (autoTimer) clearTimeout(autoTimer);
  autoTimer = null;
  const btn = document.getElementById('btnAuto');
  btn.textContent = '▶▶ 自动';
  btn.classList.remove('running');
  setButtons(!!sessionId && !gameData?.game_over);
}

async function tick() {
  if (!autoRunning || !sessionId) return;
  gameData = await apiCall('api/step', {session_id: sessionId});
  render();
  if (gameData.game_over) {
    stopAuto();
    document.getElementById('btnExport').disabled = false;
    return;
  }
  const delay = gameData.reveal_count == null ? speed : Math.max(30, speed / 3);
  autoTimer = setTimeout(tick, delay);
}

function toggleAuto() { autoRunning ? stopAuto() : startAuto(); }

async function resetGame() {
  stopAuto();
  hideLog();
  closeGames();
  if (sessionId) await apiCall('api/reset', {session_id: sessionId});
  sessionId = null;
  gameData = null;
  modalShownFor = null;
  closeModal();
  setButtons(false);
  document.getElementById('btnExport').disabled = true;
  syncStatus();
  renderCanvas();
}

async function doExport() {
  if (!sessionId) return;
  const res = await fetch('api/export', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({session_id: sessionId})});
  if (!res.ok) { alert('导出失败'); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '升级数据.xlsx';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// ---- 回放 UI ----

// 上一步/退出回放/记录按钮仅回放态显示; 对局记录有会话且非自动播放时可用
function updateReplayUI() {
  const replay = !!gameData?.replay;
  document.getElementById('btnPrev').style.display = replay ? '' : 'none';
  document.getElementById('btnPrev').disabled = !gameData?.can_prev;
  document.getElementById('btnLog').style.display = replay ? '' : 'none';
  document.getElementById('btnLive').style.display = replay ? '' : 'none';
  document.getElementById('btnGames').disabled = !sessionId || autoRunning;
  if (!replay && logOpen) hideLog();   // 离开回放态自动收起文字面板
}

// 上一步: 回到上一快照 (仅回放态可用)
async function doPrev() {
  if (!sessionId || autoRunning || !gameData?.can_prev) return;
  closeModal();
  gameData = await apiCall('api/prev', {session_id: sessionId});
  render();
}

// 退出回放: 回到实时前沿 (只移游标)
async function doLive() {
  if (!sessionId || !gameData?.replay) return;
  closeModal();
  gameData = await apiCall('api/live', {session_id: sessionId});
  render();
}

async function openGames() {
  if (!sessionId) return;
  if (autoRunning) stopAuto();
  closeModal();
  const resp = await fetch(`api/games?session_id=${sessionId}`);
  const data = await resp.json();
  if (data.error) { alert(data.error); return; }
  const methodMap = {bright: '亮牌', concealed: '闷牌', bottom_card: '底牌'};
  const tbody = document.querySelector('#gamesTable tbody');
  tbody.innerHTML = '';
  (data.games || []).forEach(g => {
    const tr = document.createElement('tr');
    tr.dataset.rnd = g.rnd;
    const ts = g.trump_suit
      ? `${SUIT_CN[g.trump_suit] || g.trump_suit}(${methodMap[g.trump_method] || '?'})` : '—';
    const cells = [g.rnd, `打 ${g.level}`, ts, `玩家${g.dealer_pid + 1}`,
                   `${g.attacker_score} 分`, `庄+${g.final_up_def} 闲+${g.final_up_att}`];
    cells.forEach(t => {
      const td = document.createElement('td');
      td.textContent = t;
      tr.appendChild(td);
    });
    const td = document.createElement('td');
    const btn = document.createElement('button');
    btn.textContent = '回放';
    btn.className = 'btn-mini';
    btn.addEventListener('click', e => { e.stopPropagation(); replayRound(g.rnd); });
    td.appendChild(btn);
    tr.appendChild(td);
    tr.addEventListener('click', () => replayRound(g.rnd));
    tbody.appendChild(tr);
  });
  document.getElementById('gamesModal').classList.remove('hidden');
}

function closeGames() { document.getElementById('gamesModal').classList.add('hidden'); }

// 回放某一局: 后端把游标跳到该局初始快照, 前端从头渲染
async function replayRound(rnd) {
  if (!sessionId) return;
  if (autoRunning) stopAuto();
  closeGames();
  closeModal();
  const resp = await apiCall('api/replay', {session_id: sessionId, rnd});
  if (resp.error) { alert(resp.error); return; }
  gameData = resp;
  render();
}

// ---- 文字记录面板 (回放态右下角上拉, 半透明) ----

function hideLog() {
  logOpen = false;
  document.getElementById('logPanel').classList.add('hidden');
}

// 记录按钮: 展开/收起切换; 展开时拉取当前所看局的事件流并渲染
async function toggleLog() {
  if (!sessionId || !gameData || !gameData.replay) return;
  if (logOpen) { hideLog(); return; }
  if (await loadLog(gameData.round)) {
    logOpen = true;
    document.getElementById('logPanel').classList.remove('hidden');
  }
}

// 拉取并渲染第 rnd 局的文字记录 (事件流已结构化, 前端排版); 成功返回 true
async function loadLog(rnd) {
  if (!sessionId || !gameData) return false;
  const mySeq = ++logSeq;                        // token: 丢弃过期响应
  const resp = await fetch(`api/logs?session_id=${sessionId}&rnd=${rnd}`);
  const data = await resp.json();
  if (mySeq !== logSeq) return false;
  if (data.error) { alert(data.error); return false; }
  renderLogBody(rnd, data.events || []);
  document.getElementById('logTitle').textContent = `第 ${rnd} 局 · 文字记录`;
  logRnd = rnd;
  logLive = gameData.live_steps || 0;
  return true;
}

// 面板开着时: 若换局 / 同局推进到新内容 → 重载
function refreshLogIfOpen() {
  if (!logOpen || !sessionId || !gameData) return;
  const rnd = gameData.round;
  const live = gameData.live_steps || 0;
  if (rnd === logRnd && live <= logLive) return;
  loadLog(rnd);
}

function lpChip(c) {
  if (!c) return '';
  const col = c.rank === '大王' ? '#c0392b'
            : c.rank === '小王' ? '#34495e'
            : (c.suit === '♥' || c.suit === '♦') ? '#c0392b' : '#1a1a2e';
  const lab = (c.rank === '大王' || c.rank === '小王') ? c.rank : `${c.rank}${c.suit}`;
  return `<span class="lchip" style="color:${col}">${lab}</span>`;
}
function lpChips(cards) { return (cards || []).map(lpChip).join(''); }

// 事件流 → HTML (按 局头/定主/埋底/捡主/每圈/结算 分组排版)
function renderLogBody(rnd, evs) {
  const html = [];
  const sides = {};                              // pid -> 庄/闲
  let dt = [], at = [];
  (evs || []).forEach(e => { if (e.type === 'round') { dt = e.dt || []; at = e.at || []; } });
  (dt || []).forEach(p => sides[p] = '庄');
  (at || []).forEach(p => sides[p] = '闲');
  const roleMark = p => sides[p]
    ? `<span class="s ${sides[p] === '庄' ? 'dz' : 'ak'}">${sides[p]}</span>` : '';
  for (const e of evs) {
    if (e.type === 'round') {
      html.push(`<div class="r-hdr">第 ${e.rnd} 局 · 庄家 玩家${e.dealer_pid + 1} · 打 ${e.def}</div>`);
      html.push(`<div class="r-side">庄家方: ${dt.map(p => `玩家${p + 1}`).join('、')}`
              + `　│　闲家方: ${at.map(p => `玩家${p + 1}`).join('、')}</div>`);
    } else if (e.type === 'trump') {
      html.push('<div class="lsect">定主</div>');
      html.push(`<div class="ln">${e.text || ''}</div>`);
    } else if (e.type === 'bury') {
      html.push(`<div class="lsect">埋底 · 庄家 玩家${e.pid + 1}</div>`);
      html.push(`<div class="ln">${e.text || ''}</div>`);
      if ((e.buried || []).length) html.push(`<div class="pcards">${lpChips(e.buried)}</div>`);
    } else if (e.type === 'pick') {
      html.push(`<div class="lsect">捡主 · 玩家${e.pid + 1}</div>`);
      html.push(`<div class="ln">${e.text || ''}</div>`);
      if ((e.picked || []).length) html.push(`<div class="pcards">${lpChips(e.picked)}</div>`);
    } else if (e.type === 'trick') {
      html.push('<div class="trick">');
      html.push(`<div class="tk-head">第 ${e.num} 圈</div>`);
      (e.plays || []).forEach(pl => {
        if (!pl.cards || !pl.cards.length) return;
        const isWin = pl.pid === e.winner;
        const note = isWin ? `胜 +${e.score}分` : '';
        html.push(`<div class="play${isWin ? ' win' : ''}">`);
        html.push(`  <div class="plab"><b>玩家${pl.pid + 1}</b>${roleMark(pl.pid)}`
                + `${note ? `<small>${note}</small>` : '<small></small>'}</div>`);
        html.push(`  <div class="pcards">${lpChips(pl.cards)}</div>`);
        html.push('</div>');
      });
      html.push('</div>');
    } else if (e.type === 'settle') {
      html.push('<div class="settle">');
      html.push(`<div class="ln">${e.text || ''}</div>`);
      if (e.result_title) html.push(`<div class="r-result">${e.result_title}</div>`);
      html.push('</div>');
    }
  }
  document.getElementById('logBody').innerHTML = html.join('');
  document.getElementById('logBody').scrollTop = 0;
}

document.getElementById('btnStart').addEventListener('click', newGame);
document.getElementById('btnStep').addEventListener('click', doStep);
document.getElementById('btnAuto').addEventListener('click', toggleAuto);
document.getElementById('btnExport').addEventListener('click', doExport);
document.getElementById('btnReset').addEventListener('click', resetGame);
document.getElementById('btnPrev').addEventListener('click', doPrev);
document.getElementById('btnGames').addEventListener('click', openGames);
document.getElementById('btnLive').addEventListener('click', doLive);
document.getElementById('btnLog').addEventListener('click', toggleLog);
document.getElementById('logClose').addEventListener('click', hideLog);
document.getElementById('gamesClose').addEventListener('click', closeGames);
document.getElementById('modalContinue').addEventListener('click', closeModal);
document.getElementById('speedSel').addEventListener('change', e => { speed = parseInt(e.target.value, 10) || 400; });
canvas.addEventListener('click', () => {
  if (!sessionId || gameData?.game_over) return;
  autoRunning ? stopAuto() : doStep();
});
document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); autoRunning ? stopAuto() : doStep(); }
  if (e.code === 'KeyN') { e.preventDefault(); newGame(); }
});

resizeCanvas();
